<!DOCTYPE html>

<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Estació Meteorològica</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	
	<link rel="icon" type="image/x-icon" href="/images/favicon.ico">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            padding: 30px;

            background: #111111;

            color: #eeeeee;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .contenidor {
            max-width: 1200px;

            margin: auto;
        }


        h1 {
            text-align: center;

            margin-bottom: 10px;

            font-size: 32px;
        }


        #actualitzacio {
            text-align: center;

            color: #aaaaaa;

            margin-bottom: 30px;
        }


        .dades {
            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 20px;

            margin-bottom: 30px;
        }


        .targeta {
            background: #1c1c1c;

            border: 1px solid #333333;

            border-radius: 12px;

            padding: 25px;

            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.3
                );
        }


        .targeta h2 {
            margin-top: 0;

            margin-bottom: 15px;

            font-size: 20px;

            color: #cccccc;
        }


        .valor {
            font-size: 36px;

            font-weight: bold;
        }


        .unitat {
            color: #999999;

            font-size: 18px;
        }


        .periodes {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 30px;
        }


        .periode {
            background: #222222;

            color: #dddddd;

            border: 1px solid #444444;

            border-radius: 8px;

            padding: 10px 18px;

            cursor: pointer;

            font-size: 15px;

            transition:
                background 0.2s,
                border-color 0.2s;
        }


        .periode:hover {
            background: #303030;

            border-color: #666666;
        }


        .periode.actiu {
            background: #eeeeee;

            color: #111111;

            border-color: #eeeeee;
        }


        .grafica {
            background: #1c1c1c;

            border: 1px solid #333333;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 25px;

            height: 400px;
        }


        .grafica canvas {
            width: 100% !important;

            height: 100% !important;
        }


        @media (max-width: 800px) {

            body {
                padding: 15px;
            }


            .dades {
                grid-template-columns:
                    1fr;
            }


            .grafica {
                height: 300px;
            }


            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

    <div class="contenidor">

        <h1>
            Estació Meteorològica
        </h1>


        <div id="actualitzacio">
            Última actualització: --
        </div>


        <div class="dades">

            <div class="targeta">

                <h2>
                    Temperatura
                </h2>

                <div class="valor">
                    <span id="temperatura">--</span>
                    <span class="unitat">ºC</span>
                </div>

            </div>


            <div class="targeta">

                <h2>
                    Humitat
                </h2>

                <div class="valor">
                    <span id="humitat">--</span>
                    <span class="unitat">%</span>
                </div>

            </div>


            <div class="targeta">

                <h2>
                    Sensació tèrmica
                </h2>

                <div class="valor">
                    <span id="sensacio">--</span>
                    <span class="unitat">ºC</span>
                </div>

            </div>

        </div>


        <div class="periodes">

            <button
                class="periode"
                data-periode="1h"
                onclick="canviarPeriode('1h')"
            >
                1 hora
            </button>


            <button
                class="periode"
                data-periode="6h"
                onclick="canviarPeriode('6h')"
            >
                6 hores
            </button>


            <button
                class="periode actiu"
                data-periode="24h"
                onclick="canviarPeriode('24h')"
            >
                24 hores
            </button>


            <button
                class="periode"
                data-periode="7d"
                onclick="canviarPeriode('7d')"
            >
                7 dies
            </button>


            <button
                class="periode"
                data-periode="tot"
                onclick="canviarPeriode('tot')"
            >
                Tot
            </button>

        </div>


        <div class="grafica">

            <canvas
                id="graficaTemperatura"
            ></canvas>

        </div>


        <div class="grafica">

            <canvas
                id="graficaHumitat"
            ></canvas>

        </div>


        <div class="grafica">

            <canvas
                id="graficaSensacio"
            ></canvas>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
